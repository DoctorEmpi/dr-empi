  <style>
    :root {
      --bg: #071018;
      --ink: #f3efe6;
      --muted: #a7b0bb;
      --card: rgba(255,255,255,.045);
      --line: rgba(255,255,255,.1);
      --gold: #e4c27a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Outfit, system-ui, sans-serif;
      background:
        radial-gradient(700px 420px at 80% -10%, rgba(228,194,122,.18), transparent 55%),
        radial-gradient(600px 380px at 0% 20%, rgba(70,130,170,.18), transparent 50%),
        var(--bg);
    }
    .wrap {
      width: min(460px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 64px;
    }
    header { text-align: center; margin-bottom: 28px; }
    .photo {
      width: 112px;
      height: 112px;
      margin: 0 auto 16px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
      border: 2px solid rgba(228,194,122,.7);
      box-shadow: 0 16px 40px rgba(0,0,0,.4);
    }
    h1 {
      margin: 0;
      font-family: Fraunces, serif;
      font-size: 40px;
      font-weight: 560;
      letter-spacing: -0.04em;
    }
    .role {
      margin: 8px 0 0;
      color: var(--gold);
      font-size: 13px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .bio {
      margin: 12px auto 0;
      max-width: 32ch;
      color: var(--muted);
      line-height: 1.5;
    }
    nav { display: grid; gap: 10px; }
    a.row {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: inherit;
      padding: 13px 14px;
      border-radius: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    a.row:hover, a.row:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(228,194,122,.45);
      background: rgba(255,255,255,.07);
    }
    .icon {
      width: 42px; height: 42px; border-radius: 13px;
      display: grid; place-items: center; flex: none;
    }
    .icon svg { width: 20px; height: 20px; fill: #fff; }
    .copy { display: flex; flex-direction: column; min-width: 0; }
    .copy strong { font-weight: 600; font-size: 16px; }
    .copy span { color: var(--muted); font-size: 13px; }
    .go { margin-left: auto; color: var(--muted); font-size: 18px; }
    footer {
      margin-top: 26px;
      text-align: center;
      color: #6f7986;
      font-size: 12px;
      letter-spacing: .04em;
    }
  </style>
